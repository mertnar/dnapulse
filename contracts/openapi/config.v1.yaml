openapi: 3.1.0
info:
  title: DNA Config Service
  version: 1.0.0
servers:
  - url: https://api.dna.local
paths:
  /v1/config/{scope}:
    get:
      summary: Get config by scope
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string, example: 'categorization' }
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema: { type: string }
    put:
      summary: Update config (RBAC required)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: scope
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        '204': { description: Updated }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
