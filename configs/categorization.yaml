# Categorization Rules Configuration
rules:
  - id: 'high-cpu-usage'
    name: 'High CPU Usage Alert'
    condition: "type == 'metric' && payload.name == 'cpu_usage' && payload.value > 80"
    labels: ['high-cpu', 'alert', 'performance']
    priority: 1
    enabled: true

  - id: 'critical-cpu-usage'
    name: 'Critical CPU Usage Alert'
    condition: "type == 'metric' && payload.name == 'cpu_usage' && payload.value > 95"
    labels: ['critical-cpu', 'urgent', 'performance']
    priority: 1
    enabled: true

  - id: 'high-memory-usage'
    name: 'High Memory Usage Alert'
    condition: "type == 'metric' && payload.name == 'memory_usage' && payload.value > 85"
    labels: ['high-memory', 'alert', 'performance']
    priority: 2
    enabled: true

  - id: 'disk-space-low'
    name: 'Low Disk Space Alert'
    condition: "type == 'metric' && payload.name == 'disk_usage' && payload.value > 90"
    labels: ['low-disk', 'alert', 'storage']
    priority: 3
    enabled: true

  - id: 'error-logs'
    name: 'Error Level Logs'
    condition: "type == 'log' && payload.level == 'error'"
    labels: ['error', 'alert', 'logs']
    priority: 4
    enabled: true

  - id: 'warning-logs'
    name: 'Warning Level Logs'
    condition: "type == 'log' && payload.level == 'warning'"
    labels: ['warning', 'logs']
    priority: 5
    enabled: true

  - id: 'database-errors'
    name: 'Database Connection Errors'
    condition: "type == 'log' && payload.level == 'error' && payload.message.includes('database')"
    labels: ['database-error', 'critical', 'infrastructure']
    priority: 2
    enabled: true

  - id: 'network-errors'
    name: 'Network Connectivity Issues'
    condition: "type == 'log' && payload.level == 'error' && payload.message.includes('network')"
    labels: ['network-error', 'alert', 'infrastructure']
    priority: 3
    enabled: true

  - id: 'authentication-failures'
    name: 'Authentication Failures'
    condition: "type == 'log' && payload.level == 'warning' && payload.message.includes('auth')"
    labels: ['auth-failure', 'security', 'warning']
    priority: 4
    enabled: true

  - id: 'api-rate-limit'
    name: 'API Rate Limit Exceeded'
    condition: "attributes.status == '429' || payload.message.includes('rate limit')"
    labels: ['rate-limit', 'api', 'warning']
    priority: 5
    enabled: true

metadata:
