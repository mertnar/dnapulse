version: '1.0.0'
updated_at: '2025-10-18T00:00:00Z'
cardinality: one_to_many
label_kind: category
pipelines:
  - name: default
    description: Default categorization pipeline
    enabled: true
    priority: 1
    labelers:
      - type: rule_based
        name: basic_rules
        enabled: true
        priority: 1
        config:
          rules:
            - condition: "item.type == 'document'"
              label: 'Document'
              score: 1.0
            - condition: "item.type == 'image'"
              label: 'Image'
              score: 1.0
            - condition: "item.type == 'video'"
              label: 'Video'
              score: 1.0
