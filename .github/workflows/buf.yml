name: Buf CI

on:
  pull_request:
    paths:
      - 'contracts/proto/**'
      - 'contracts/buf.yaml'
      - 'contracts/buf.gen.yaml'
  push:
    branches:
      - main
    paths:
      - 'contracts/proto/**'

jobs:
  lint-and-breaking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for breaking change detection

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Protobuf
        working-directory: contracts
        run: buf lint

      - name: Breaking Change Detection
        if: github.event_name == 'pull_request'
        working-directory: contracts
        run: buf breaking --against ".git#branch=${{ github.base_ref }}"

      - name: Generate Code (validation)
        working-directory: contracts
        run: buf generate

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Generated code is out of sync. Run 'buf generate' locally."
            git diff
            exit 1
          fi

