name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  protobuf-lint:
    name: Protobuf Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint protobuf files
        run: buf lint

      - name: Check protobuf breaking changes
        run: buf breaking --against '.git#branch=main'

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion, processing, correlation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: go test -v ./...

      - name: Run linter
        working-directory: services/${{ matrix.service }}
        run: golangci-lint run --timeout=5m

  nodejs-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [decision, config, categorization]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Build TypeScript
        working-directory: services/${{ matrix.service }}
        run: npm run build

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test

      - name: Run TypeScript linter
        working-directory: services/${{ matrix.service }}
        run: npx eslint src/ --ext .ts

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: services/model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/model
        run: python -m pytest tests/ -v

      - name: Run linter
        working-directory: services/model
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [lint-and-format, protobuf-lint, go-tests, nodejs-tests, python-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start local stack
        run: |
          make up
          sleep 30  # Wait for services to be healthy

      - name: Bootstrap topics and indices
        run: make seed

      - name: Test ingestion endpoint
        run: |
          response=$(curl -s -w "%{http_code}" -X POST http://localhost:8092/ingest \
            -H 'Content-Type: application/json' \
            -d '{"metric":"cpu_usage","value":95.5,"source":"test-server"}')
          echo "Response: $response"
          if [[ "$response" != *"202"* ]]; then
            echo "Ingestion test failed"
            exit 1
          fi

      - name: Test config endpoint
        run: |
          response=$(curl -s -w "%{http_code}" -X GET http://localhost:8087/health)
          echo "Config health response: $response"
          if [[ "$response" != *"200"* ]]; then
            echo "Config service health check failed"
            exit 1
          fi

      - name: Test processing endpoint
        run: |
          response=$(curl -s -w "%{http_code}" -X GET http://localhost:8093/health)
          echo "Processing health response: $response"
          if [[ "$response" != *"200"* ]]; then
            echo "Processing service health check failed"
            exit 1
          fi

      - name: Wait for event processing
        run: sleep 10

      - name: Check Elasticsearch alerts
        run: |
          alerts=$(curl -s "http://localhost:9200/alerts/_count" | jq '.count')
          echo "Alerts count: $alerts"
          if [ "$alerts" -lt 1 ]; then
            echo "No alerts found in Elasticsearch"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: make down

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [go-tests, nodejs-tests, python-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DNA Platform images
        run: |
          # Build all service images
          docker build -t dna-platform/ingestion:latest -f services/ingestion/Dockerfile .
          docker build -t dna-platform/processing:latest -f services/processing/Dockerfile .
          docker build -t dna-platform/decision:latest -f services/decision/Dockerfile .
          docker build -t dna-platform/config:latest -f services/config/Dockerfile .
          docker build -t dna-platform/categorization:latest -f services/categorization/Dockerfile .
          docker build -t dna-platform/correlation:latest -f services/correlation/Dockerfile .
          docker build -t dna-platform/model:latest -f services/model/Dockerfile .

      - name: Test Docker Compose
        run: |
          # Test docker-compose build
          cd deploy/compose
          docker compose -f docker-compose.local.yml build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
