version: '3.8'

services:
  # Message Bus - Redpanda (Kafka-compatible)
  bus:
    image: redpandadata/redpanda:v23.3.5
    container_name: dna-bus
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://bus:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://bus:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr bus:33145
      - --advertise-rpc-addr bus:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    ports:
      - '19092:19092'
      - '18081:18081'
      - '18082:18082'
      - '9644:9644'
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep 'Healthy:.*true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dna-services-net

  # Database - MongoDB
  mongo:
    image: mongo:7.0
    container_name: dna-mongo
    ports:
      - '27018:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dna-services-net

  # Search & Analytics - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: dna-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dna-services-net

  # Config Service (TypeScript)
  config:
    build:
      context: ../../
      dockerfile: services/config/Dockerfile
    container_name: dna-config
    ports:
      - '8084:8080'
    environment:
      - MONGO_URL=mongodb://admin:admin123@mongo:27017/config?authSource=admin
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://0.0.0.0:8080/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dna-services-net
    restart: unless-stopped

  # Init Container for Config Loading
  init-configs:
    image: node:20-alpine
    container_name: dna-init-configs
    volumes:
      - ../../configs:/configs:ro
    depends_on:
      config:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Installing packages...' &&
        apk add --no-cache curl &&
        echo 'Waiting for config service to be ready...' &&
        until curl -f http://config:8080/health; do
          echo 'Config service not ready, waiting...'
          sleep 2
        done &&
        echo 'Config service is ready, loading configurations...' &&
        curl -X PUT -H 'Content-Type: text/plain' --data-binary @/configs/ingestion.yaml http://config:8080/v1/config/ingestion &&
        echo 'Loaded ingestion.yaml' &&
        curl -X PUT -H 'Content-Type: text/plain' --data-binary @/configs/processing.rules.yaml http://config:8080/v1/config/processing &&
        echo 'Loaded processing.rules.yaml' &&
        curl -X PUT -H 'Content-Type: text/plain' --data-binary @/configs/categorization.yaml http://config:8080/v1/config/categorization &&
        echo 'Loaded categorization.yaml' &&
        echo 'All configurations loaded successfully!'
      "
    networks:
      - dna-services-net

  # Ingestion Service (Go)
  ingestion:
    build:
      context: ../../
      dockerfile: services/ingestion/Dockerfile
    container_name: dna-ingestion
    ports:
      - '19071:19071' # HTTP port
      - '9090:9090' # gRPC port
    environment:
      - CONFIG_URL=http://config:8080
      - CONFIG_SCOPE=ingestion
      - KAFKA_BROKERS=bus:9092
      - KAFKA_TOPIC=ingestion.raw.v1
      - HTTP_PORT=19071
      - GRPC_PORT=9090
      - MONGO_URL=mongodb://admin:admin123@mongo:27017/dna-pulse?authSource=admin
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=ingestion-events
      - METRICS_PORT=9091
    depends_on:
      bus:
        condition: service_healthy
      init-configs:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://0.0.0.0:19071/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dna-services-net
    restart: unless-stopped

  # Processing Service (Go)
  processing:
    build:
      context: ../../
      dockerfile: services/processing/Dockerfile
    container_name: dna-processing
    ports:
      - '8082:8080'
    environment:
      - CONFIG_URL=http://config:8080
      - CONFIG_SCOPE=processing
      - KAFKA_BROKERS=bus:9092
      - KAFKA_INPUT_TOPIC=ingestion.raw.v1
      - KAFKA_OUTPUT_TOPIC=processing.cleaned.v1
      - KAFKA_GROUP_ID=processing-service
      - HTTP_PORT=8080
      - MONGO_URI=mongodb://admin:admin123@mongo:27017/processing?authSource=admin
      - ELASTIC_ADDRESSES=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=processing-events
      - METRICS_PORT=9092
      - PIPELINES_DIR=/app/pipelines
    volumes:
      - processing-pipelines:/app/pipelines
    depends_on:
      bus:
        condition: service_healthy
      init-configs:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://0.0.0.0:8080/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dna-services-net
    restart: unless-stopped

  # Categorization Service (TypeScript)
  categorization:
    build:
      context: ../../services/categorization
      dockerfile: Dockerfile
    container_name: dna-categorization
    ports:
      - '8083:8083'
    environment:
      - CONFIG_URL=http://config:8080
      - CONFIG_SCOPE=categorization
      - CONFIG_SSE_URL=http://config:8080/v1/stream
      - MONGO_URI=mongodb://admin:admin123@mongo:27017/categorization?authSource=admin
      - MONGO_DATABASE=categorization
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=categorized-items
      - KAFKA_BROKERS=bus:9092
      - KAFKA_INPUT_TOPIC=processing.cleaned.v1
      - KAFKA_OUTPUT_TOPIC=categorization.results.v1
      - PORT=8083
      - BYPASS_AUTH=true
      - LOG_LEVEL=info
      - METRICS_PORT=9093
    depends_on:
      bus:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      init-configs:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://0.0.0.0:8083/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dna-services-net
    restart: unless-stopped

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dna-prometheus
    ports:
      - '9091:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - config
    networks:
      - dna-services-net
    restart: unless-stopped

  # Grafana - Monitoring Dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: dna-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - dna-services-net
    restart: unless-stopped

networks:
  dna-services-net:
    driver: bridge

volumes:
  mongo-data:
  es-data:
  prometheus-data:
  grafana-data:
  processing-pipelines:
