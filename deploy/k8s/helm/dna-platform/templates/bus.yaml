{{- if .Values.infrastructure.redpanda.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dna-platform.fullname" . }}-redpanda
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dna-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        {{- include "dna-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redpanda
      {{- if .Values.infrastructure.redpanda.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.infrastructure.redpanda.metrics.port }}"
        prometheus.io/path: "{{ .Values.infrastructure.redpanda.metrics.path }}"
      {{- end }}
    spec:
      containers:
      - name: redpanda
        image: "{{ .Values.infrastructure.redpanda.image.repository }}:{{ .Values.infrastructure.redpanda.image.tag }}"
        imagePullPolicy: {{ .Values.infrastructure.redpanda.image.pullPolicy }}
        command:
        - /bin/bash
        - -c
        - |
          rpk redpanda start --smp 1 --memory 512M --reserve-memory 0M --overprovisioned --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
        ports:
        - containerPort: {{ .Values.infrastructure.redpanda.service.port }}
          name: kafka-internal
        - containerPort: {{ .Values.infrastructure.redpanda.service.externalPort }}
          name: kafka-external
        {{- if .Values.infrastructure.redpanda.metrics.enabled }}
        - containerPort: {{ .Values.infrastructure.redpanda.metrics.port }}
          name: metrics
        {{- end }}
        resources:
          {{- toYaml .Values.infrastructure.redpanda.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.infrastructure.redpanda.persistence.enabled }}
        - name: data
          mountPath: /var/lib/redpanda/data
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: 9644
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9644
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      {{- if .Values.infrastructure.redpanda.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "dna-platform.fullname" . }}-redpanda-pvc
      {{- end }}
---
{{- if .Values.infrastructure.redpanda.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dna-platform.fullname" . }}-redpanda-pvc
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.redpanda.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
  {{- if .Values.infrastructure.redpanda.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.infrastructure.redpanda.metrics.port }}"
    prometheus.io/path: "{{ .Values.infrastructure.redpanda.metrics.path }}"
  {{- end }}
spec:
  type: {{ .Values.infrastructure.redpanda.service.type }}
  ports:
  - port: {{ .Values.infrastructure.redpanda.service.port }}
    targetPort: kafka-internal
    protocol: TCP
    name: kafka-internal
  - port: {{ .Values.infrastructure.redpanda.service.externalPort }}
    targetPort: kafka-external
    protocol: TCP
    name: kafka-external
  {{- if .Values.infrastructure.redpanda.metrics.enabled }}
  - port: {{ .Values.infrastructure.redpanda.metrics.port }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    {{- include "dna-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redpanda
{{- end }}
