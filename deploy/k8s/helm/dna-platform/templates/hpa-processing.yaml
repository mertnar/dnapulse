{{- if and .Values.services.processing.enabled .Values.services.processing.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dna-platform.fullname" . }}-processing-hpa
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: processing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "dna-platform.fullname" . }}-processing
  minReplicas: {{ .Values.services.processing.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.processing.hpa.maxReplicas }}
  metrics:
  {{- if .Values.services.processing.hpa.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.services.processing.hpa.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.services.processing.hpa.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.services.processing.hpa.targetMemoryUtilizationPercentage }}
  {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
{{- end }}
