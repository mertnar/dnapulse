{{- if .Values.services.ingestion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dna-platform.fullname" . }}-ingestion
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  replicas: {{ .Values.services.ingestion.replicas }}
  selector:
    matchLabels:
      {{- include "dna-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      labels:
        {{- include "dna-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion
      {{- if .Values.services.ingestion.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.services.ingestion.metrics.port }}"
        prometheus.io/path: "{{ .Values.services.ingestion.metrics.path }}"
      {{- end }}
    spec:
      {{- with .Values.security.serviceAccount }}
      serviceAccountName: {{ include "dna-platform.serviceAccountName" $ }}
      {{- end }}
      containers:
      - name: ingestion
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.ingestion.image.repository }}:{{ .Values.services.ingestion.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.services.ingestion.service.port }}
          name: http
        {{- if .Values.services.ingestion.metrics.enabled }}
        - containerPort: {{ .Values.services.ingestion.metrics.port }}
          name: metrics
        {{- end }}
        env:
        {{- range $key, $value := .Values.services.ingestion.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.services.ingestion.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.services.ingestion.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.services.ingestion.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
  {{- if .Values.services.ingestion.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.services.ingestion.metrics.port }}"
    prometheus.io/path: "{{ .Values.services.ingestion.metrics.path }}"
  {{- end }}
spec:
  type: {{ .Values.services.ingestion.service.type }}
  ports:
  - port: {{ .Values.services.ingestion.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  {{- if .Values.services.ingestion.metrics.enabled }}
  - port: {{ .Values.services.ingestion.metrics.port }}
    targetPort: metrics
    protocol: TCP
    name: metrics
  {{- end }}
  selector:
    {{- include "dna-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
{{- end }}
