{{- if .Values.infrastructure.mongodb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dna-platform.fullname" . }}-mongodb
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dna-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongodb
  template:
    metadata:
      labels:
        {{- include "dna-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongodb
    spec:
      containers:
      - name: mongodb
        image: "{{ .Values.infrastructure.mongodb.image.repository }}:{{ .Values.infrastructure.mongodb.image.tag }}"
        imagePullPolicy: {{ .Values.infrastructure.mongodb.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.infrastructure.mongodb.service.port }}
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: {{ .Values.infrastructure.mongodb.auth.rootUsername | quote }}
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: {{ .Values.infrastructure.mongodb.auth.rootPassword | quote }}
        - name: MONGO_INITDB_DATABASE
          value: {{ .Values.infrastructure.mongodb.auth.database | quote }}
        resources:
          {{- toYaml .Values.infrastructure.mongodb.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.infrastructure.mongodb.persistence.enabled }}
        - name: data
          mountPath: /data/db
        {{- end }}
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      {{- if .Values.infrastructure.mongodb.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "dna-platform.fullname" . }}-mongodb-pvc
      {{- end }}
---
{{- if .Values.infrastructure.mongodb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dna-platform.fullname" . }}-mongodb-pvc
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.mongodb.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: {{ .Values.infrastructure.mongodb.service.type }}
  ports:
  - port: {{ .Values.infrastructure.mongodb.service.port }}
    targetPort: mongodb
    protocol: TCP
    name: mongodb
  selector:
    {{- include "dna-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
{{- end }}
