{{- if .Values.infrastructure.elasticsearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dna-platform.fullname" . }}-elasticsearch
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  replicas: {{ .Values.infrastructure.elasticsearch.replicas }}
  selector:
    matchLabels:
      {{- include "dna-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        {{- include "dna-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: "{{ .Values.infrastructure.elasticsearch.image.repository }}:{{ .Values.infrastructure.elasticsearch.image.tag }}"
        imagePullPolicy: {{ .Values.infrastructure.elasticsearch.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.infrastructure.elasticsearch.service.port }}
          name: http
        env:
        - name: discovery.type
          value: {{ .Values.infrastructure.elasticsearch.config.discovery.type | quote }}
        - name: cluster.name
          value: {{ .Values.infrastructure.elasticsearch.config.cluster.name | quote }}
        - name: xpack.security.enabled
          value: {{ .Values.infrastructure.elasticsearch.config.xpack.security.enabled | quote }}
        - name: xpack.security.enrollment.enabled
          value: {{ .Values.infrastructure.elasticsearch.config.xpack.security.enrollment.enabled | quote }}
        - name: "ES_JAVA_OPTS"
          value: "-Xms512m -Xmx512m"
        resources:
          {{- toYaml .Values.infrastructure.elasticsearch.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.infrastructure.elasticsearch.persistence.enabled }}
        - name: data
          mountPath: /usr/share/elasticsearch/data
        {{- end }}
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: {{ .Values.infrastructure.elasticsearch.service.port }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: {{ .Values.infrastructure.elasticsearch.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      {{- if .Values.infrastructure.elasticsearch.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "dna-platform.fullname" . }}-elasticsearch-pvc
      {{- end }}
---
{{- if .Values.infrastructure.elasticsearch.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dna-platform.fullname" . }}-elasticsearch-pvc
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.infrastructure.elasticsearch.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  type: {{ .Values.infrastructure.elasticsearch.service.type }}
  ports:
  - port: {{ .Values.infrastructure.elasticsearch.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "dna-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
{{- end }}
