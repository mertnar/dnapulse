apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mini-dna-platform.fullname" . }}-platform-config
  labels:
    {{- include "mini-dna-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-config
data:
  platform.yaml: |
    # Platform Configuration
    # Bu dosya hangi servislerin aktif olacağını belirler
    services:
      ingestion:
        enabled: true
        description: "Event ingestion service"
      processing:
        enabled: true
        description: "Event processing and normalization service"
      model:
        enabled: true
        description: "ML model inference service"
      categorization:
        enabled: false
        description: "Event categorization service"
      correlation:
        enabled: false
        description: "Event correlation service"
      decision:
        enabled: false
        description: "Decision engine service"

    # Platform metadata
    metadata:
      version: '1.0.0'
      updated_at: '2025-01-27T00:00:00Z'
      updated_by: 'platform-admin'
      description: 'Platform configuration for mini-dna-platform deployment'
